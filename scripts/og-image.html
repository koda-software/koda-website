  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #02020d;
    font-family: "Sora", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(85% 80% at 50% 42%, rgba(0, 103, 244, 0.22) 0%, rgba(0, 103, 244, 0) 65%),
      radial-gradient(80% 70% at 88% 100%, rgba(126, 231, 255, 0.10) 0%, rgba(126, 231, 255, 0) 60%),

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  .canvas::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 220px 60px rgba(2, 2, 13, 0.65);
    pointer-events: none;
  }
  .logo {
    width: 520px;
    height: auto;
    display: block;
  }
  .rule {
    width: 96px;
    height: 1.5px;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(118, 185, 252, 1) 50%, rgba(255,255,255,0) 100%);
  }
  .tagline {
    font-size: 25px;
    font-weight: 300;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(230, 233, 240, 0.72);
  }
</style>
