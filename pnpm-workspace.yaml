allowBuilds:
  # fumadocs-mdx compiles source.config.ts with esbuild.
  esbuild: true
  sharp: false
  unrs-resolver: false
  # Copied from the docs repo, where @scalar/api-client-react needs it.
  vue-demi: true
# Copied from the docs repo: these @scalar releases were pinned before they reached pnpm's
# minimum release age.
minimumReleaseAgeExclude:
  - '@scalar/api-client-react@2.0.26'
  - '@scalar/api-client@3.10.4'
  - '@scalar/code-highlight@0.3.6'
  - '@scalar/components@0.27.2'
  - '@scalar/oas-utils@0.18.5'
  - '@scalar/schemas@0.5.0'
  - '@scalar/sidebar@0.9.23'
  - '@scalar/snippetz@0.9.17'
  - '@scalar/types@0.14.0'
  - '@scalar/use-codemirror@0.14.12'
  - '@scalar/use-hooks@0.4.7'
  - '@scalar/workspace-store@0.54.4'

# Fumadocs 16.10.3 stringification recurses with mdast-util-to-markdown 2.1.3.
# Keep the version used by the source docs lockfile until that integration is upgraded.
overrides:
  mdast-util-to-markdown: 2.1.2
